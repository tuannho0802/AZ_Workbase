name: UptimeRobot KeepAlive - tạm dừng cuối tuần

# UptimeRobot free KHÔNG có Maintenance -> dùng API tự Pause/Resume monitor KeepAlive để không gọi vào T7/CN (giờ VN).
# Cần 2 GitHub Secrets: UPTIMEROBOT_API_KEY (Main API key hoặc key theo monitor) và UPTIMEROBOT_KEEPALIVE_MONITOR_ID.
# GitHub cron có thể trễ vài phút -> đặt dư an toàn. Lớp dự phòng: backend tự trả 200 nhanh vào T7/CN (weekend-skip.util.ts).

on:
  schedule:
    # Pause: 17:00 UTC Thứ 6 = 00:00 Thứ 7 giờ VN
    - cron: '0 17 * * 5'
    # Resume: 23:00 UTC Chủ nhật = 06:00 Thứ 2 giờ VN (trước giờ làm để làm ấm instance + DB)
    - cron: '0 23 * * 0'
  workflow_dispatch:
    inputs:
      action:
        description: 'pause hoặc resume (chạy tay để test)'
        required: true
        default: 'resume'

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - name: Pause/Resume monitor KeepAlive
        env:
          API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
          MONITOR_ID: ${{ secrets.UPTIMEROBOT_KEEPALIVE_MONITOR_ID }}
          MANUAL_ACTION: ${{ github.event.inputs.action }}
          CRON_EXPR: ${{ github.event.schedule }}
        run: |
          if [ -n "$MANUAL_ACTION" ]; then ACTION="$MANUAL_ACTION"
          elif [ "$CRON_EXPR" = "0 17 * * 5" ]; then ACTION="pause"
          else ACTION="resume"; fi
          if [ "$ACTION" = "pause" ]; then STATUS=0; else STATUS=1; fi   # UptimeRobot API v2: 0 = paused, 1 = started
          echo "Action: $ACTION (status=$STATUS)"
          RESP=$(curl -sS -X POST "https://api.uptimerobot.com/v2/editMonitor" \
            -d "api_key=$API_KEY" -d "id=$MONITOR_ID" -d "status=$STATUS" -d "format=json")
          # Không in RESP đầy đủ ra log (tránh lộ thông tin); chỉ kiểm tra stat
          echo "$RESP" | grep -q '"stat":"ok"' || { echo "UptimeRobot trả lỗi - kiểm tra API key/monitor id"; exit 1; }
          echo "OK"
