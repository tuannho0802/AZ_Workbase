name: UptimeRobot - tạm dừng cuối tuần (KeepAlive + 2 cron)

# UptimeRobot free KHÔNG có Maintenance -> dùng API tự Pause/Resume 3 monitor để không gọi vào T7/CN (giờ VN):
#   802882548 KeepAlive AZ-Workbase | 803835309 AutoSync for Attendance | 804107733 Cronjob for Check out-dated Task
# Cần 1 GitHub Secret: UPTIMEROBOT_API_KEY (Main API key). ID monitor không phải bí mật nên ghi thẳng ở env MONITOR_IDS.
# (Secret UPTIMEROBOT_KEEPALIVE_MONITOR_ID tạo ở bản trước không còn được dùng - có thể xoá.)
# GitHub cron có thể trễ vài phút. Lớp dự phòng: backend tự trả 200 nhanh vào T7/CN (weekend-skip.util.ts).

on:
  schedule:
    # Pause: 17:00 UTC Thứ 6 = 00:00 Thứ 7 giờ VN
    - cron: '0 17 * * 5'
    # Resume: 23:00 UTC Chủ nhật = 06:00 Thứ 2 giờ VN (trước giờ làm để làm ấm instance + DB)
    - cron: '0 23 * * 0'
  workflow_dispatch:
    inputs:
      action:
        description: 'pause hoặc resume (chạy tay để test)'
        required: true
        default: 'resume'

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - name: Pause/Resume các monitor
        env:
          API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
          MONITOR_IDS: '802882548 803835309 804107733'
          MANUAL_ACTION: ${{ github.event.inputs.action }}
          CRON_EXPR: ${{ github.event.schedule }}
        run: |
          if [ -n "$MANUAL_ACTION" ]; then ACTION="$MANUAL_ACTION"
          elif [ "$CRON_EXPR" = "0 17 * * 5" ]; then ACTION="pause"
          else ACTION="resume"; fi
          if [ "$ACTION" = "pause" ]; then STATUS=0; else STATUS=1; fi   # UptimeRobot API v2: 0 = paused, 1 = started
          echo "Action: $ACTION (status=$STATUS)"
          FAILED=0
          for ID in $MONITOR_IDS; do
            RESP=$(curl -sS -X POST "https://api.uptimerobot.com/v2/editMonitor" \
              -d "api_key=$API_KEY" -d "id=$ID" -d "status=$STATUS" -d "format=json")
            # Không in RESP đầy đủ ra log (tránh lộ thông tin); chỉ kiểm tra stat
            if echo "$RESP" | grep -q '"stat":"ok"'; then echo "monitor $ID: OK"
            else echo "monitor $ID: LỖI - kiểm tra API key/monitor id"; FAILED=1; fi
            sleep 7   # gói free giới hạn 10 request/phút
          done
          exit $FAILED
